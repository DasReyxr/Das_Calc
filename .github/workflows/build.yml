name: Build Das Calculator

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # que un SO roto no cancele a los demás
      matrix:
        include:
          - os: windows-latest
            name: windows
            binary: dist/DasCalculator.exe
            asset: DasCalculator-windows.exe
          - os: ubuntu-latest
            name: linux
            binary: dist/DasCalculator
            asset: DasCalculator-linux
            asset2: DasCalculator-linux.tar.gz
          - os: macos-latest      # Apple Silicon (arm64)
            name: macos
            binary: dist/DasCalculator
            asset: DasCalculator-macos.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(python -c "from core.version import __version__; print(__version__)")
          [ "v$V" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != version.py (v$V)"; exit 1; }
      
      - name: Check imports
        run: python -c "import ui.app"

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean DasCalculator.spec

      - name: Check executable exists
        shell: bash
        run: test -f "${{ matrix.binary }}" || { echo "${{ matrix.binary }} no se generó"; ls -R dist; exit 1; }

      # Linux/macOS: empaquetar en tar.gz para conservar el permiso de ejecución
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: tar -czf "${{ matrix.asset }}" -C dist DasCalculator

      - name: Package (Linux/Windows)
        if: matrix.name != 'macos'
        shell: bash
        run: |
          cp "${{ matrix.binary }}" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Package tar.gz (Linux)
        if: matrix.name == 'linux'
        run: tar -czf "${{ matrix.asset2 }}" -C dist DasCalculator

      - uses: actions/upload-artifact@v4
        with:
          name: DasCalculator-${{ matrix.name }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset2 }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DasCalculator-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            DasCalculator-windows.exe
            DasCalculator-linux
            DasCalculator-linux.tar.gz
            DasCalculator-macos.tar.gz