name: Build Das Calculator

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        run: python -c "import ui.app"

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean DasCalculator.spec

      - name: Check executable exists
        run: |
          if (!(Test-Path dist/DasCalculator.exe)) { throw "dist/DasCalculator.exe no se generó" }

      - uses: actions/upload-artifact@v4
        with:
          name: DasCalculator-windows
          path: dist/DasCalculator.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DasCalculator-windows

      - uses: softprops/action-gh-release@v2
        with:
          files: DasCalculator.exe
